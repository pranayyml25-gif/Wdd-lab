<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Demo - Practical 10</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }
        
        header {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2em;
        }
        
        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        nav {
            display: flex;
            justify-content: center;
            background: #222;
            padding: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        nav button {
            margin: 5px;
            padding: 12px 20px;
            border: none;
            background: #4facfe;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
        }
        
        nav button:hover {
            background: #00c6ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        iframe {
            width: 100%;
            height: 70vh;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
        }
        
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: center;
            }
            
            iframe {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌐 HTML Iframe Practical</h1>
        <p>Department of First Year, S.B.J.I.T.M.R., Nagpur<br>
        Web Designing Lab (N-VSCCM102P)</p>
    </header>
    
    <div class="container">
        <nav>
            <button onclick="loadPage('https://www.wikipedia.org')">
                📖 Wikipedia
            </button>
            <button onclick="loadPage('https://www.example.com')">
                🌐 Example Site
            </button>
            <button onclick="loadPage('https://www.openstreetmap.org')">
                🗺️ OpenStreetMap
            </button>
            <button onclick="loadPage('https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3781.67!2d79.088!3d21.15!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjjCsDA5JzAwIiBOIDc5wrAwNSkyOC4yIiBF!5e0!3m2!1sen!2sin!4v1690000000000')">
                📍 Google Maps
            </button>
        </nav>
        
        <iframe 
            id="frame" 
            src="https://www.example.com" 
            title="Embedded Content"
            loading="lazy"
        ></iframe>
    </div>

    <script>
        function loadPage(page) {
            const iframe = document.getElementById("frame");
            iframe.src = page;
            iframe.style.opacity = '0.3';
            iframe.style.transition = 'opacity 0.3s ease';
            
            iframe.onload = function() {
                iframe.style.opacity = '1';
            };
        }
    </script>
</body>
</html>
